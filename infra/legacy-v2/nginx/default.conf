server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    absolute_redirect off;

    location / {
        # Forward requests to the Spring Boot application via IPv6 loopback.
        proxy_pass http://[::1]:8080;

        # Rewrite HTTP redirects returned by the backend as HTTPS redirects.
        proxy_redirect http:// https://;

        # Preserve the original request and client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Inform Spring Boot that the external client connection uses HTTPS.
        proxy_set_header X-Forwarded-Proto https;
    }
}