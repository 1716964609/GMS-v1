<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC: 用語管理システム（技術実証・閲覧用モデル）</title>
    <link rel="stylesheet" href="consolepage_user.css">
    <script src="consolepage_user.js" defer></script>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>PoC: 翻訳用語管理システム（技術実証・閲覧用モデル）</h1>
        <p style="font-size: 0.85em; color: #666; margin-top: 5px;">本ページは、データ構造の検索・表示パフォーマンスを検証するための静的アーカイブです</p>
    </header>

    <main class="main-content">
        <section class="search-section">
            <form class="search-form">
                <input type="text" placeholder="アーカイブ内を検索" id="search-input">
                <button type="submit">検索</button>
            </form>
            <div class="search-results">
                <table>
                    <thead>
                    <tr>
                        <th>検索結果（検証用サンプル）</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="glossary-lists-section">
            <div class="glossary-lists-content">
                <table>
                    <thead>
                    <tr>
                        <th>収録データセット（静的アーカイブ）</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="glossary-list-details-section">
            <div class="glossary-list-details-content">
                <p>データセット名</p>
                <textarea placeholder="Dataset Name" disabled></textarea>
                <p>保存バージョン</p>
                <textarea placeholder="Version" disabled></textarea>
                <p>アーカイブ説明</p>
                <textarea placeholder="Description (Archive Metadata)" disabled></textarea>
            </div>
        </section>

        <section class="glossary-terms-section">
            <div class="glossary-terms-content">
                <table>
                    <thead>
                    <tr>
                        <th>収録用語（解析用）</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="glossary-term-details-section">
            <div class="glossary-term-details-content">
                <p>用語（JP）</p>
                <textarea placeholder="Japanese Term" disabled></textarea>
                <p>用語（EN）</p>
                <textarea placeholder="English Term" disabled></textarea>
                <p>管理バージョン</p>
                <textarea placeholder="Snapshot Version" disabled></textarea>
                <p>解析情報</p>
                <textarea placeholder="Linguistic / Technical Analysis" disabled></textarea>
                <p>所属アーカイブ</p>
                <textarea placeholder="Parent Dataset" disabled></textarea>
            </div>
        </section>
    </main>

    <footer class="footer">
        © 2024-<span id="currentYear"></span> 翻訳用語管理 PoC Project. All Rights Reserved.
        <br>
        <small>Static Archive Mode / Infrastructure Lab Usage Only.</small>
        <br>
    </footer>
</div>
</body>
</html>
