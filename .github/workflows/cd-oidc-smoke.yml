name: GMS CD OIDC Smoke Test

on:
  push:
    branches:
      - v3.1
    paths:
      - ".github/workflows/cd-oidc-smoke.yml"

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::180294215932:role/gms-github-deploy-role
          aws-region: ap-northeast-1
          allowed-account-ids: 180294215932
          role-session-name: gms-oidc-smoke-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify S3 upload permission
        run: |
          echo "GITHUB_OIDC_S3_OK" > /tmp/gms-oidc-smoke.txt

          aws s3 cp \
            /tmp/gms-oidc-smoke.txt \
            "s3://gms-artifacts-180294215932-ap-northeast-1/releases/oidc-smoke/${GITHUB_SHA}.txt" \
            --region ap-northeast-1

      - name: Verify SSM deployment permission
        shell: bash
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --region ap-northeast-1 \
            --instance-ids i-08e35c2a08562e6e7 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo GITHUB_OIDC_SSM_OK","curl -fsS http://127.0.0.1:8080/actuator/health"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $CMD_ID"

          sleep 3

          aws ssm get-command-invocation \
            --region ap-northeast-1 \
            --command-id "$CMD_ID" \
            --instance-id i-08e35c2a08562e6e7 \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}'
