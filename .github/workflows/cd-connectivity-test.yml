name: GMS CD Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-ec2-connectivity:
    runs-on: ubuntu-latest

    steps:
      - name: Show IPv6 configuration
        run: |
          echo "=== IPv6 addresses ==="
          ip -6 addr show

          echo "=== IPv6 routes ==="
          ip -6 route show

      - name: Test SSH connectivity to GMS EC2
        run: |
          nc -6 -vz -w 10 \
            2406:da14:190f:d6a8:6c4a:da24:5520:8a7e \
            22
